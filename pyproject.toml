[project]
name = "trmwithquant"
version = "0.1.0"
description = "Tiny Recursive Models with Quantitative Finance - Leak-Free Denoising Pipeline"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    # Core Dependencies
    "torch>=2.0.0",
    "numpy>=1.24.0",
    "pandas>=2.0.0",

    # Machine Learning Models
    "scikit-learn>=1.3.0",
    "xgboost>=2.0.0",
    "lightgbm>=4.0.0",
    "catboost>=1.2.0",

    # Utilities
    "tqdm>=4.65.0",
    "einops>=0.7.0",
]

[project.optional-dependencies]
# Training only (heavy dependencies, GPU required)
training = [
    "mamba-ssm>=1.0.0",
    "causal-conv1d>=1.0.0",
]

[tool.uv.workspace]
members = [
    "FeatureEngineering",
]
